<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Book a verified driver with DrivX for local, round-trip and outstation journeys.">
  <meta property="og:title" content="DrivX — Your journey, in trusted hands">
  <meta property="og:description" content="Reliable drivers for the journeys that matter.">
  <meta property="og:url" content="https://drivx.in/">
  <title>DrivX — Your journey, in trusted hands</title>
  <script src="/analytics-config.js"></script>
  <script defer src="/analytics.js"></script>
  <style>
    .bottom-cta .drivx-support-inline{box-sizing:border-box;max-width:430px;margin-top:25px;padding-top:18px;border-top:1px solid rgba(255,255,255,.28);font-family:inherit;text-align:left}
    .bottom-cta .drivx-support-inline *{box-sizing:border-box}
    .bottom-cta .drivx-support-inline h3{margin:0 0 7px;color:#fff;font-family:inherit;font-size:16px;font-weight:700;line-height:1.3;letter-spacing:-.02em}
    .bottom-cta .drivx-support-inline p{max-width:none;margin:0;color:rgba(255,255,255,.88);font-family:inherit;font-size:12px;font-weight:400;line-height:1.65}
    .bottom-cta .drivx-support-links{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:13px}
    .bottom-cta .drivx-support-links a{color:#fff;font-family:inherit;font-size:11px;font-weight:600;line-height:1.5;text-decoration:underline;text-decoration-color:rgba(255,255,255,.55);text-underline-offset:3px;overflow-wrap:anywhere;transition:color .18s ease,opacity .18s ease}
    .bottom-cta .drivx-support-links a:hover{color:#191719;text-decoration-color:currentColor}
    @media(max-width:760px){.bottom-cta .drivx-support-inline{max-width:none;margin-top:22px;padding-top:16px}.bottom-cta .drivx-support-links{gap:9px 13px}}
    .cities-card .eyebrow{display:inline-flex;align-items:center;gap:9px;opacity:1!important}
    .cities-card .eyebrow:before{content:"";width:8px;height:8px;flex:none;border-radius:50%;background:#7df0ad;box-shadow:0 0 0 0 rgba(125,240,173,.55);animation:drivx-live-pulse 1.8s ease-out infinite}
    .cities-card h3 em{color:#fff!important}
    .cities-card .city-list span{align-items:center;gap:10px}
    .cities-card .city-list b{flex:none;padding:5px 8px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.12);color:#d8ffe7;font-size:8px;letter-spacing:.08em;opacity:1}
    .cities-card .drivx-live-note{margin:15px 0 0;color:rgba(255,255,255,.82);font-size:10px;line-height:1.55}
    @keyframes drivx-live-pulse{0%{box-shadow:0 0 0 0 rgba(125,240,173,.55)}70%{box-shadow:0 0 0 8px rgba(125,240,173,0)}100%{box-shadow:0 0 0 0 rgba(125,240,173,0)}}
    .site-header .driver-app-button{border-color:#2563eb!important;color:#2563eb!important;background:rgba(37,99,235,.06)!important;white-space:nowrap}
    .site-header .driver-app-button:hover{border-color:#2563eb!important;background:#2563eb!important;color:#fff!important;box-shadow:0 10px 22px rgba(37,99,235,.22)!important}
    .site-header .driver-app-button:focus-visible{outline:3px solid rgba(37,99,235,.3);outline-offset:3px}
    .drivx-app-topbar{position:relative;isolation:isolate;overflow:hidden;width:100%;background:linear-gradient(105deg,#f3f0eb 0%,#faf8f4 55%,#f3f0eb 100%);border-bottom:1px solid #dfddd8;color:#171719;font-family:inherit}
    .drivx-app-topbar:before{position:absolute;z-index:-1;content:"";width:250px;height:120px;top:-80px;right:14%;border-radius:50%;background:rgba(37,99,235,.055);filter:blur(30px);pointer-events:none}
    .drivx-app-topbar:after{position:absolute;right:5.5vw;bottom:0;left:5.5vw;height:1px;content:"";background:linear-gradient(90deg,transparent,rgba(37,99,235,.38),transparent);background-size:200% 100%;animation:drivx-app-barline 7s ease-in-out infinite;pointer-events:none}
    .drivx-app-topbar *{box-sizing:border-box}
    .drivx-app-topbar-inner{width:min(1160px,89vw);min-height:66px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;animation:drivx-app-enter .65s cubic-bezier(.2,.7,.2,1) both}
    .drivx-app-topbar-brand{display:flex;align-items:center;gap:11px;min-width:0}
    .drivx-app-topbar-mark{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1px solid #dedbd5;border-radius:12px;background:linear-gradient(145deg,#fff,#f3f0eb);color:#2563eb;box-shadow:0 5px 14px rgba(24,31,55,.07)}
    .drivx-app-topbar-mark svg{width:18px;height:18px}
    .drivx-app-topbar-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
    .drivx-app-topbar-copy small{display:flex;align-items:center;gap:6px;color:#777575;font-size:8px;font-weight:800;letter-spacing:.12em;line-height:1.1;text-transform:uppercase}
    .drivx-app-topbar-copy small:before{width:6px;height:6px;flex:none;border-radius:50%;content:"";background:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    .drivx-app-topbar-copy strong{color:#171719;font-size:12px;font-weight:800;letter-spacing:-.025em;line-height:1.25;white-space:nowrap}
    .drivx-app-topbar-links{display:flex;align-items:center;gap:8px;flex:none}
    .drivx-app-topbar-links a{min-height:42px;min-width:145px;padding:0 11px;display:flex;align-items:center;gap:9px;border:1px solid #171719;border-radius:11px;background:#171719;color:#fff;text-decoration:none;box-shadow:0 5px 12px rgba(17,17,19,.12);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,background .2s ease}
    .drivx-app-topbar-links a:hover{transform:translateY(-2px);border-color:#2563eb;background:#202126;box-shadow:0 9px 20px rgba(37,99,235,.18)}
    .drivx-app-topbar-links a:focus-visible{outline:3px solid rgba(37,99,235,.25);outline-offset:2px}
    .drivx-store-icon{width:25px;height:25px;flex:none;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;transition:transform .2s ease}
    .drivx-store-icon svg{width:18px;height:18px;display:block;overflow:visible}
    .drivx-store-icon .apple-mark{fill:currentColor}
    .drivx-store-copy{display:flex;flex:1;flex-direction:column;gap:2px;min-width:0}
    .drivx-store-copy small{color:#b9bbc2;font-size:7px;font-weight:700;line-height:1.1}
    .drivx-store-copy strong{color:#fff;font-size:10px;font-weight:800;line-height:1.2;white-space:nowrap}
    .drivx-store-soon{padding:4px 6px;border-radius:999px;background:rgba(37,99,235,.2);color:#bcd0ff;font-size:7px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
    .drivx-app-topbar-links a:hover .drivx-store-icon{transform:scale(1.08)}
    @keyframes drivx-app-enter{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes drivx-app-barline{0%,100%{background-position:100% 0}50%{background-position:0 0}}
    @media(max-width:760px){.drivx-app-topbar:after{right:12px;left:12px}.drivx-app-topbar-inner{width:calc(100% - 24px);min-height:62px;gap:8px}.drivx-app-topbar-brand{gap:7px}.drivx-app-topbar-mark{width:30px;height:30px;border-radius:10px}.drivx-app-topbar-mark svg{width:15px;height:15px}.drivx-app-topbar-copy{gap:0}.drivx-app-topbar-copy small{display:none}.drivx-app-topbar-copy strong{font-size:9px;white-space:normal;max-width:94px}.drivx-app-topbar-links{gap:5px}.drivx-app-topbar-links a{min-height:38px;min-width:0;padding:0 7px;gap:5px;border-radius:9px}.drivx-store-icon{width:21px;height:21px;border-radius:7px}.drivx-store-icon svg{width:15px;height:15px}.drivx-store-copy small{font-size:6px}.drivx-store-copy strong{font-size:8px}.drivx-store-soon{padding:3px 4px;font-size:6px}}
    @media(max-width:360px){.drivx-app-topbar-inner{width:calc(100% - 16px)}.drivx-app-topbar-brand{gap:5px}.drivx-app-topbar-mark{width:26px;height:26px}.drivx-app-topbar-copy strong{font-size:8px;max-width:76px}.drivx-app-topbar-links{gap:4px}.drivx-app-topbar-links a{padding:0 5px;gap:4px}.drivx-store-soon{display:none}}
    @media(prefers-reduced-motion:reduce){.drivx-app-topbar-inner,.drivx-app-topbar:after{animation:none}.drivx-app-topbar-links a,.drivx-store-icon{transition:none}.drivx-app-topbar-links a:hover{transform:none}}
    @media(prefers-reduced-motion:reduce){.cities-card .eyebrow:before{animation:none}}
  </style>
  <script>
    (()=>{
      const go=url=>{window.location.href=url};
      document.addEventListener("click",event=>{
        const target=event.target.closest("[data-testid]");
        if(!target)return;
        const id=target.getAttribute("data-testid")||"";
        if(id==="app-store-button"||id==="play-store-button"){
          event.preventDefault();event.stopImmediatePropagation();go(`/app-coming-soon.html?store=${id==="app-store-button"?"app-store":"google-play"}`);return;
        }
        if(id==="driver-app-button"){
          event.preventDefault();event.stopImmediatePropagation();go("/driver/sign-in");return;
        }
        if(/^(header-book-button|hero-book-button|difference-cta-button|bottom-book-button|service-.*-button)$/.test(id)){
          event.preventDefault();event.stopImmediatePropagation();go("/customer/sign-in");return;
        }
        if(id==="app-preview-button"){
          event.preventDefault();event.stopImmediatePropagation();go(/driver/i.test(target.textContent||"")?"/driver/sign-in":"/customer/sign-in");
        }
      },true);
      const enhance=()=>{
        const root=document.getElementById("root");
        if(!root)return;
        const header=root.querySelector(".site-header");
        if(header&&!root.querySelector(".drivx-app-topbar")){
          const appBar=document.createElement("aside");
          appBar.className="drivx-app-topbar";
          appBar.setAttribute("aria-label","DrivX app availability");
          appBar.innerHTML='<div class="drivx-app-topbar-inner"><div class="drivx-app-topbar-brand"><span class="drivx-app-topbar-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10 18.2h4"/></svg></span><span class="drivx-app-topbar-copy"><small>DrivX mobile</small><strong>Premium rides, one tap away</strong></span></div><nav class="drivx-app-topbar-links" aria-label="App store links"><a href="/app-coming-soon.html?store=app-store" aria-label="DrivX for iPhone, coming soon"><span class="drivx-store-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="apple-mark" d="M18.71 19.5c-.83 1.24-1.71 2.48-3.05 2.5-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.54-1.7-2.46-3-6.98-1.25-10.03.87-1.52 2.43-2.48 4.12-2.51 1.3-.02 2.53.87 3.29.87.75 0 2.24-1.07 3.78-.92.64.28 2.43.78 3.58 2.94-.09.06-2.13 1.24-2.11 3.7.03 2.95 2.59 3.93 2.62 3.94-.02.07-.41 1.41-1.28 2.82m-5.05-14.42c.68-.82 1.14-1.96 1.02-3.08-1 .04-2.22.67-2.94 1.49-.65.74-1.22 1.9-1.07 3.01 1.12.09 2.3-.57 2.99-1.42"/></svg></span><span class="drivx-store-copy"><small>Coming soon</small><strong>App Store</strong></span><span class="drivx-store-soon">Soon</span></a><a href="/app-coming-soon.html?store=google-play" aria-label="DrivX for Android, coming soon"><span class="drivx-store-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.2 2.1c-.1.2-.2.5-.2.9v18c0 .4.1.7.2.9L13.7 12z" fill="#32c5f4"/><path d="M3.2 2.1 14.5 12l4.1-4.2L5.3 1.4c-.8-.4-1.6-.1-2.1.7z" fill="#34a853"/><path d="m14.5 12 4.1-4.2 3.2 1.8c.9.5.9 1.8 0 2.3l-3.2 1.8z" fill="#fbbc04"/><path d="m3.2 21.9 11.3-9.9 4.1 4.2-13.3 7.6c-.8.4-1.6.1-2.1-.7z" fill="#ea4335"/></svg></span><span class="drivx-store-copy"><small>Coming soon</small><strong>Google Play</strong></span><span class="drivx-store-soon">Soon</span></a></nav></div>';
          header.before(appBar);
        }
        for(const section of root.querySelectorAll("section")){
          const text=(section.innerText||section.textContent||"").replace(/\s+/g," ").toLowerCase();
          if((text.includes("inside the experience")||text.includes("drivx / design system"))&&!(section.style.getPropertyValue("display")==="none"&&section.style.getPropertyPriority("display")==="important"))section.style.setProperty("display","none","important");
        }
        const cities=root.querySelector(".cities-card");
        if(cities){
          const eyebrow=cities.querySelector(".eyebrow");
          const heading=cities.querySelector("h3");
          const list=cities.querySelector(".city-list");
          if(eyebrow&&eyebrow.textContent!=="NOW SERVING DELHI NCR")eyebrow.textContent="NOW SERVING DELHI NCR";
          if(heading&&heading.innerHTML!=="We’re live across<br><em>Delhi NCR.</em>")heading.innerHTML="We’re live across<br><em>Delhi NCR.</em>";
          if(list&&list.dataset.drivxLive!=="true"){
            list.dataset.drivxLive="true";
            list.innerHTML='<span>Delhi <b>LIVE</b></span><span>Gurugram <b>LIVE</b></span><span>Noida <b>LIVE</b></span><span>Greater Noida <b>LIVE</b></span><span>Ghaziabad <b>LIVE</b></span><span>Faridabad <b>LIVE</b></span>';
            const note=document.createElement("p");
            note.className="drivx-live-note";
            note.textContent="Book a trusted driver across Delhi, Gurugram, Noida and nearby NCR cities. More cities are coming soon.";
            list.after(note);
          }
        }
        const cta=root.querySelector("section.bottom-cta");
        if(!cta||cta.querySelector(".drivx-support-inline"))return;
        const columns=cta.querySelectorAll(":scope > div");
        const details=columns[1];
        if(!details)return;
        const panel=document.createElement("div");
        panel.className="drivx-support-inline";
        panel.setAttribute("aria-label","DrivX customer support and policies");
        panel.innerHTML='<h3>Here when you need us.</h3><p>Questions about a booking? Our customer support team is ready to help. Review how DrivX protects your information and booking terms.</p><div class="drivx-support-links"><a href="mailto:customersupport@drivx.in">Email customer support</a><a href="tel:+919209069483">+91 92090 69483</a><a href="tel:+918708506508">+91 87085 06508</a><a href="/privacy-policy.html">Privacy Policy</a><a href="/cashfree-review.html#terms">Terms &amp; Conditions</a></div>';
        details.appendChild(panel);
      };
      const start=()=>{
        const root=document.getElementById("root");
        if(!root){requestAnimationFrame(start);return;}
        const observer=new MutationObserver(enhance);
        observer.observe(root,{childList:true,subtree:true});
        enhance();
      };
      if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start,{once:true});else start();
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script defer src="/assets/drivx-emergent.js"></script>
</body>
</html>
