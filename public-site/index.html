<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Book a verified driver with DrivX for local, round-trip and outstation journeys.">
  <meta property="og:title" content="DrivX — Your journey, in trusted hands">
  <meta property="og:description" content="Reliable drivers for the journeys that matter.">
  <meta property="og:url" content="https://drivx.in/">
  <title>DrivX — Your journey, in trusted hands</title>
  <script src="/analytics-config.js"></script>
  <script defer src="/analytics.js"></script>
  <style>
    .bottom-cta .drivx-support-inline{box-sizing:border-box;max-width:430px;margin-top:25px;padding-top:18px;border-top:1px solid rgba(255,255,255,.28);font-family:inherit;text-align:left}
    .bottom-cta .drivx-support-inline *{box-sizing:border-box}
    .bottom-cta .drivx-support-inline h3{margin:0 0 7px;color:#fff;font-family:inherit;font-size:16px;font-weight:700;line-height:1.3;letter-spacing:-.02em}
    .bottom-cta .drivx-support-inline p{max-width:none;margin:0;color:rgba(255,255,255,.88);font-family:inherit;font-size:12px;font-weight:400;line-height:1.65}
    .bottom-cta .drivx-support-links{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:13px}
    .bottom-cta .drivx-support-links a{color:#fff;font-family:inherit;font-size:11px;font-weight:600;line-height:1.5;text-decoration:underline;text-decoration-color:rgba(255,255,255,.55);text-underline-offset:3px;overflow-wrap:anywhere;transition:color .18s ease,opacity .18s ease}
    .bottom-cta .drivx-support-links a:hover{color:#191719;text-decoration-color:currentColor}
    @media(max-width:760px){.bottom-cta .drivx-support-inline{max-width:none;margin-top:22px;padding-top:16px}.bottom-cta .drivx-support-links{gap:9px 13px}}
    .cities-card .eyebrow{display:inline-flex;align-items:center;gap:9px;opacity:1!important}
    .cities-card .eyebrow:before{content:"";width:8px;height:8px;flex:none;border-radius:50%;background:#7df0ad;box-shadow:0 0 0 0 rgba(125,240,173,.55);animation:drivx-live-pulse 1.8s ease-out infinite}
    .cities-card h3 em{color:#fff!important}
    .cities-card .city-list span{align-items:center;gap:10px}
    .cities-card .city-list b{flex:none;padding:5px 8px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.12);color:#d8ffe7;font-size:8px;letter-spacing:.08em;opacity:1}
    .cities-card .drivx-live-note{margin:15px 0 0;color:rgba(255,255,255,.82);font-size:10px;line-height:1.55}
    @keyframes drivx-live-pulse{0%{box-shadow:0 0 0 0 rgba(125,240,173,.55)}70%{box-shadow:0 0 0 8px rgba(125,240,173,0)}100%{box-shadow:0 0 0 0 rgba(125,240,173,0)}}
    .site-header .driver-app-button{border-color:#2563eb!important;color:#2563eb!important;background:rgba(37,99,235,.06)!important;white-space:nowrap}
    .site-header .driver-app-button:hover{border-color:#2563eb!important;background:#2563eb!important;color:#fff!important;box-shadow:0 10px 22px rgba(37,99,235,.22)!important}
    .site-header .driver-app-button:focus-visible{outline:3px solid rgba(37,99,235,.3);outline-offset:3px}
    @media(prefers-reduced-motion:reduce){.cities-card .eyebrow:before{animation:none}}
  </style>
  <script>
    (()=>{
      const go=url=>{window.location.href=url};
      document.addEventListener("click",event=>{
        const target=event.target.closest("[data-testid]");
        if(!target)return;
        const id=target.getAttribute("data-testid")||"";
        if(id==="app-store-button"||id==="play-store-button"){
          event.preventDefault();event.stopImmediatePropagation();go(`/app-coming-soon.html?store=${id==="app-store-button"?"app-store":"google-play"}`);return;
        }
        if(id==="driver-app-button"){
          event.preventDefault();event.stopImmediatePropagation();go("/driver/sign-in");return;
        }
        if(/^(header-book-button|hero-book-button|difference-cta-button|bottom-book-button|service-.*-button)$/.test(id)){
          event.preventDefault();event.stopImmediatePropagation();go("/customer/sign-in");return;
        }
        if(id==="app-preview-button"){
          event.preventDefault();event.stopImmediatePropagation();go(/driver/i.test(target.textContent||"")?"/driver/sign-in":"/customer/sign-in");
        }
      },true);
      const enhance=()=>{
        const root=document.getElementById("root");
        if(!root)return;
        for(const section of root.querySelectorAll("section")){
          const text=(section.innerText||section.textContent||"").replace(/\s+/g," ").toLowerCase();
          if((text.includes("inside the experience")||text.includes("drivx / design system"))&&!(section.style.getPropertyValue("display")==="none"&&section.style.getPropertyPriority("display")==="important"))section.style.setProperty("display","none","important");
        }
        const cities=root.querySelector(".cities-card");
        if(cities){
          const eyebrow=cities.querySelector(".eyebrow");
          const heading=cities.querySelector("h3");
          const list=cities.querySelector(".city-list");
          if(eyebrow&&eyebrow.textContent!=="NOW SERVING DELHI NCR")eyebrow.textContent="NOW SERVING DELHI NCR";
          if(heading&&heading.innerHTML!=="We’re live across<br><em>Delhi NCR.</em>")heading.innerHTML="We’re live across<br><em>Delhi NCR.</em>";
          if(list&&list.dataset.drivxLive!=="true"){
            list.dataset.drivxLive="true";
            list.innerHTML='<span>Delhi <b>LIVE</b></span><span>Gurugram <b>LIVE</b></span><span>Noida <b>LIVE</b></span><span>Greater Noida <b>LIVE</b></span><span>Ghaziabad <b>LIVE</b></span><span>Faridabad <b>LIVE</b></span>';
            const note=document.createElement("p");
            note.className="drivx-live-note";
            note.textContent="Book a trusted driver across Delhi, Gurugram, Noida and nearby NCR cities. More cities are coming soon.";
            list.after(note);
          }
        }
        const cta=root.querySelector("section.bottom-cta");
        if(!cta||cta.querySelector(".drivx-support-inline"))return;
        const columns=cta.querySelectorAll(":scope > div");
        const details=columns[1];
        if(!details)return;
        const panel=document.createElement("div");
        panel.className="drivx-support-inline";
        panel.setAttribute("aria-label","DrivX customer support and policies");
        panel.innerHTML='<h3>Here when you need us.</h3><p>Questions about a booking? Our customer support team is ready to help. Review how DrivX protects your information and booking terms.</p><div class="drivx-support-links"><a href="mailto:customersupport@drivx.in">Email customer support</a><a href="tel:+918708506508">+91 87085 06508</a><a href="tel:+919813015150">+91 98130 51505</a><a href="/privacy-policy.html">Privacy Policy</a><a href="/cashfree-review.html#terms">Terms &amp; Conditions</a></div>';
        details.appendChild(panel);
      };
      const start=()=>{
        const root=document.getElementById("root");
        if(!root){requestAnimationFrame(start);return;}
        const observer=new MutationObserver(enhance);
        observer.observe(root,{childList:true,subtree:true});
        enhance();
      };
      if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start,{once:true});else start();
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script defer src="/assets/drivx-emergent.js"></script>
</body>
</html>
